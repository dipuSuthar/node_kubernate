apiVersion: v1
kind: Service
metadata:
  name: {{ include "eks-cicd-demo.fullname" . }}
  labels:
    {{- include "eks-cicd-demo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "eks-cicd-demo.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}