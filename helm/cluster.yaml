apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-cicd-ap-south-1
  region: ap-south-1

managedNodeGroups:
  - name: app-nodes
    instanceType: t3.micro
    minSize: 1
    desiredCapacity: 3
    maxSize: 3
    volumeSize: 20
    volumeType: gp3
    labels:
      role: application